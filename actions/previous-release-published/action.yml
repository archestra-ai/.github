name: Previous release published
description: Fail a release-please PR while an older release on its line is still a draft, keep one comment on the PR saying why, and re-run the check once that release is published.
inputs:
  mode:
    description: "check (pull_request and merge_group) or recheck (schedule, workflow_dispatch, release: re-run the failed checks of open release PRs that are now clear)."
    default: check
  tag-prefix:
    description: The release tag prefix before the version (for example platform-v or v).
    required: true
  release-branches:
    description: "true when release/X.Y branches release X.Y.Z and the default branch releases prereleases; false when every release is on one line."
    default: "false"
  release-workflow:
    description: The workflow file whose push run creates each release (for example release-please.yml), linked from the comment. Empty links none.
    default: ""
  token:
    description: "Token for the calling repository. check: contents write (only push access lists drafts), pull-requests write, actions read. recheck: contents write, pull-requests read, actions write."
    default: ${{ github.token }}
runs:
  using: composite
  steps:
    - name: Check the previous release is published
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        GH_REPO: ${{ github.repository }}
        MODE: ${{ inputs.mode }}
        EVENT_NAME: ${{ github.event_name }}
        HEAD_REF: ${{ github.head_ref }}
        TAG_PREFIX: ${{ inputs.tag-prefix }}
        RELEASE_BRANCHES: ${{ inputs.release-branches }}
        RELEASE_WORKFLOW: ${{ inputs.release-workflow }}
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        # owner/repo/.github/workflows/<file>@<ref>: recheck re-runs that file's runs.
        WORKFLOW_REF: ${{ github.workflow_ref }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        MERGE_GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
        MERGE_GROUP_HEAD_SHA: ${{ github.event.merge_group.head_sha }}
        MERGE_GROUP_HEAD_REF: ${{ github.event.merge_group.head_ref }}
        CHECK_SCRIPT: ${{ github.action_path }}/check.py
      run: |
        case "$MODE" in
          check)
            if [ "$EVENT_NAME" = pull_request ] && [[ "$HEAD_REF" != release-please--branches--* ]]; then
              echo "Not a release PR: nothing to wait for."
              exit 0
            fi
            [ "$EVENT_NAME" = pull_request ] || [ "$EVENT_NAME" = merge_group ] \
              || { echo "::error::mode check runs on pull_request and merge_group, not $EVENT_NAME"; exit 1; }
            ;;
          recheck)
            WORKFLOW_FILE=${WORKFLOW_REF%@*}
            export WORKFLOW_FILE=${WORKFLOW_FILE##*/}
            ;;
          *)
            echo "::error::mode must be check or recheck, not $MODE"
            exit 1
            ;;
        esac
        python3 -I "$CHECK_SCRIPT" "$MODE"
