name: Validate a VEX document
description: >-
  Check a project's OpenVEX document with the same rules release-publish.yml applies when it attests
  each image's statements (attest-release-image/vex.py), so a bad statement fails its pull request
  instead of the release.
inputs:
  document:
    description: Path to the OpenVEX document, relative to the workspace (for example vex/openvex.json).
    default: vex/openvex.json
runs:
  using: composite
  steps:
    - name: Validate the VEX document
      shell: bash
      env:
        DOCUMENT: ${{ inputs.document }}
        VEX: ${{ github.action_path }}/../attest-release-image/vex.py
      run: python3 -I "$VEX" validate --document "$DOCUMENT"
