name: Set up skopeo
description: >-
  Builds a pinned skopeo from source and installs it in /usr/local/bin, ahead
  of the runner's packaged one (/usr/bin) on PATH.

# Ubuntu 24.04 packages skopeo 1.13, whose image library re-serializes an image
# index in two ways that change it, so "copy --all --preserve-digests" refuses
# the index ("Manifest list must be converted to type ... Instructed to
# preserve digests"):
# - it drops the OCI descriptor field artifactType, which Crossplane packages
#   carry ("up xpkg append" sets it on the Marketplace extensions descriptor);
# - it records each zstd instance as an io.github.containers.compression.zstd
#   annotation, and Docker Hardened Images ship zstd layers, so every image
#   built on one has them.
# skopeo 1.24 copies both unchanged.
#
# go install verifies every module against skopeo's go.sum and the Go checksum
# database. No module cache is restored: this runs in jobs that hold registry
# credentials.
runs:
  using: composite
  steps:
    - name: Set up Go
      uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
      with:
        go-version: "1.25.7" # skopeo's go.mod
        cache: false

    - name: Build skopeo
      shell: bash
      env:
        SKOPEO_MODULE: go.podman.io/skopeo/cmd/skopeo
        SKOPEO_VERSION: v1.24.1
        # A static build: OpenPGP in Go instead of gpgme, no storage drivers
        # that need C libraries. Callers only copy between registries and
        # archives.
        SKOPEO_TAGS: containers_image_openpgp exclude_graphdriver_btrfs exclude_graphdriver_devicemapper
        CGO_ENABLED: "0"
        GOTOOLCHAIN: local
        GOFLAGS: -trimpath
      run: |
        set -euo pipefail
        bin="$RUNNER_TEMP/skopeo-bin"
        GOBIN="$bin" go install -tags "$SKOPEO_TAGS" "$SKOPEO_MODULE@$SKOPEO_VERSION"
        sudo install -m 0755 "$bin/skopeo" /usr/local/bin/skopeo
        [ "$(command -v skopeo)" = /usr/local/bin/skopeo ]
        skopeo --version
