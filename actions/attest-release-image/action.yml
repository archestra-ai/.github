name: Attest a release image
description: >-
  Sign SBOMs (SPDX and CycloneDX), a secret scan, a malware scan, an image benchmark (the CIS Docker Benchmark's
  image checks) and (when given) a vulnerability scan and the image's OpenVEX statements for one release image,
  under its public name. The OpenVEX statements are the project's (vex-document) plus those Docker states for the
  image's Docker Hardened Images bases (base-images-from). A live secret, malware, or a benchmark failure no
  waiver covers stops the job before anything is attested.
inputs:
  image:
    description: Where to pull the image from, pinned by digest (for example ghcr.io/archestra-ai/ci/platform@sha256:...). Log in to its registry first.
    required: true
  subject-name:
    description: The image's public name, without tag or digest (for example docker.io/archestra/platform). The attestations are made for this name and the image's digest.
    required: true
  platform:
    description: The platform whose packages the SBOM lists, for a multi-platform image.
    default: linux/amd64
  vulnerability-report:
    description: Path to the JSON report of the vulnerability scan already run on this digest. Empty skips the vulnerability attestation.
    default: ""
  vulnerability-scanner-uri:
    description: The scanner that wrote vulnerability-report (for example https://github.com/docker/scout-cli).
    default: ""
  vulnerability-scanner-version:
    description: The scanner's version.
    default: ""
  vex-document:
    description: >-
      Path to the project's OpenVEX document (https://openvex.dev/ns/v0.2.0). The statements whose
      product is `pkg:oci/<last segment of subject-name>` are attested for this digest. Empty, or no
      statement naming the image, attests no VEX.
    default: ""
  base-images-from:
    description: >-
      Dockerfiles (paths, one per line) the image is built from. Docker signs an OpenVEX attestation for each
      Docker Hardened Images image; for each `FROM dhi.io/...@sha256:...` base they pin, its statements that are
      facts about a package build (`fixed`; `not_affected` with vulnerable_code_not_present or
      component_not_present) are attested for this image too, for each package whose exact build (the apk
      database's name, version and checksum) the image holds on every platform. A statement of vex-document wins
      for the same vulnerability and package. Log in to dhi.io first. Empty carries nothing over.
    default: ""
  on-verified-secret:
    description: "`fail` (default): a secret trufflehog verifies as live stops the job, unattested. `record`: attest the counts and continue."
    default: fail
  malware-scan:
    description: >-
      `true` (default): scan the image's files with ClamAV, with signatures fetched for this scan, and attest the
      result (https://archestra.ai/attestations/malware-scan/v1). When ClamAV's mirror refuses the signature
      download, the step warns and attests no malware scan.
    default: "true"
  on-malware:
    description: "`fail` (default): a ClamAV detection stops the job, unattested. `record`: attest the detections and continue."
    default: fail
  image-benchmark:
    description: >-
      `true` (default): check the image with Dockle (the CIS Docker Benchmark's image checks and Dockle's own) and
      attest the result (https://archestra.ai/attestations/image-benchmark/v1).
    default: "true"
  benchmark-key:
    description: The image's key in the release request, which benchmark waivers match. Empty uses subject-name.
    default: ""
  benchmark-waivers:
    description: >-
      Path to the project's benchmark waivers:
      `{"waivers": [{"images": ["<key or glob>"], "check": "CIS-DI-0001", "reason": "..."}]}`. A waived check
      is attested with its reason. Empty waives nothing.
    default: ""
  on-benchmark-failure:
    description: "`fail` (default): a FATAL or WARN check no waiver covers stops the job, unattested. `record`: attest it and continue."
    default: fail
  attest:
    description: "`false` builds the SBOM and runs the scans without signing anything (for tests)."
    default: "true"
outputs:
  sbom-path:
    description: The SPDX JSON SBOM.
    value: ${{ steps.paths.outputs.sbom }}
  cyclonedx-path:
    description: The CycloneDX JSON SBOM.
    value: ${{ steps.paths.outputs.cyclonedx }}
  secret-scan-path:
    description: The secret scan predicate.
    value: ${{ steps.paths.outputs.secrets }}
  benchmark-path:
    description: The image benchmark predicate (absent when no benchmark ran).
    value: ${{ inputs.image-benchmark == 'true' && steps.paths.outputs.benchmark || '' }}
  malware-scan-path:
    description: The malware scan predicate (absent when no scan ran).
    value: ${{ steps.malware.outputs.attest == 'true' && steps.paths.outputs.malware || '' }}
  vex-path:
    description: The OpenVEX document attested for the image (absent when no statement names it).
    value: ${{ steps.vex.outputs.attest == 'true' && steps.paths.outputs.vex || '' }}
runs:
  using: composite
  steps:
    - name: Prepare
      id: paths
      shell: bash
      env:
        IMAGE: ${{ inputs.image }}
        SUBJECT_NAME: ${{ inputs.subject-name }}
        ON_VERIFIED: ${{ inputs.on-verified-secret }}
        ON_MALWARE: ${{ inputs.on-malware }}
        ON_BENCHMARK: ${{ inputs.on-benchmark-failure }}
        REPORT: ${{ inputs.vulnerability-report }}
        SCANNER_URI: ${{ inputs.vulnerability-scanner-uri }}
        SCANNER_VERSION: ${{ inputs.vulnerability-scanner-version }}
        PREDICATES: ${{ github.action_path }}/predicates.py
      run: |
        set -euo pipefail
        case "$ON_VERIFIED" in fail|record) ;; *) echo "::error::on-verified-secret must be fail or record"; exit 1 ;; esac
        case "$ON_MALWARE" in fail|record) ;; *) echo "::error::on-malware must be fail or record"; exit 1 ;; esac
        case "$ON_BENCHMARK" in fail|record) ;; *) echo "::error::on-benchmark-failure must be fail or record"; exit 1 ;; esac
        if [ -n "$REPORT" ] && { [ -z "$SCANNER_URI" ] || [ -z "$SCANNER_VERSION" ]; }; then
          echo "::error::vulnerability-report needs vulnerability-scanner-uri and vulnerability-scanner-version"; exit 1
        fi
        work=$(mktemp -d "$RUNNER_TEMP/attest-release-image.XXXXXX")
        python3 -I "$PREDICATES" subjects "$IMAGE" "$SUBJECT_NAME" "$work/subjects.txt"
        {
          echo "work=$work"
          echo "bin=$work/bin"
          echo "subjects=$work/subjects.txt"
          echo "sbom=$work/sbom.spdx.json"
          echo "cyclonedx=$work/sbom.cdx.json"
          echo "secrets=$work/secret-scan.json"
          echo "malware=$work/malware-scan.json"
          echo "benchmark=$work/image-benchmark.json"
          echo "vulnerabilities=$work/vulnerabilities.json"
          echo "vex=$work/vex.json"
        } >> "$GITHUB_OUTPUT"

    - name: Install syft, trufflehog and oras
      id: tools
      shell: bash
      env:
        BIN: ${{ steps.paths.outputs.bin }}
        INSTALL: ${{ github.action_path }}/install-tools.sh
      run: bash "$INSTALL" "$BIN"

    - name: Build the SBOMs
      shell: bash
      env:
        IMAGE: ${{ inputs.image }}
        PLATFORM: ${{ inputs.platform }}
        SYFT: ${{ steps.paths.outputs.bin }}/syft
        SBOM: ${{ steps.paths.outputs.sbom }}
        CYCLONEDX: ${{ steps.paths.outputs.cyclonedx }}
        SYFT_CHECK_FOR_APP_UPDATE: "false"
      run: |
        set -euo pipefail
        # One scan, both formats: they list the same packages.
        "$SYFT" scan "registry:$IMAGE" --platform "$PLATFORM" --quiet \
          --output "spdx-json=$SBOM" --output "cyclonedx-json=$CYCLONEDX"
        echo "SBOM of $IMAGE ($PLATFORM): $(jq '.packages | length' "$SBOM") packages"
        for file in "$SBOM" "$CYCLONEDX"; do
          echo "  $(basename "$file"): $(stat -c %s "$file") bytes"
          # actions/attest refuses a predicate over 16 MiB; say so here instead.
          [ "$(stat -c %s "$file")" -lt 16777216 ] || { echo "::error::$(basename "$file") of $IMAGE is over 16 MiB, too large to attest"; exit 1; }
        done

    - name: Scan for secrets
      shell: bash
      env:
        IMAGE: ${{ inputs.image }}
        TRUFFLEHOG: ${{ steps.paths.outputs.bin }}/trufflehog
        VERSION: ${{ steps.tools.outputs.trufflehog-version }}
        WORK: ${{ steps.paths.outputs.work }}
        PREDICATE: ${{ steps.paths.outputs.secrets }}
        ON_VERIFIED: ${{ inputs.on-verified-secret }}
        PREDICATES: ${{ github.action_path }}/predicates.py
      run: |
        set -euo pipefail
        started=$(date -u +%Y-%m-%dT%H:%M:%SZ)
        # Findings go to a file the runner never prints: only counts and
        # detector names leave this step.
        "$TRUFFLEHOG" docker --image "$IMAGE" --json --no-update > "$WORK/findings.jsonl" 2> "$WORK/trufflehog.log" \
          || { tail -n 20 "$WORK/trufflehog.log"; echo "::error::trufflehog could not scan $IMAGE"; exit 1; }
        finished=$(date -u +%Y-%m-%dT%H:%M:%SZ)
        status=0
        python3 -I "$PREDICATES" secrets "$WORK/findings.jsonl" "$PREDICATE" --image "$IMAGE" \
          --version "$VERSION" --started "$started" --finished "$finished" --on-verified "$ON_VERIFIED" || status=$?
        rm -f "$WORK/findings.jsonl"
        exit "$status"

    - name: Check the image against the benchmark
      if: ${{ inputs.image-benchmark == 'true' }}
      shell: bash
      env:
        IMAGE: ${{ inputs.image }}
        PLATFORM: ${{ inputs.platform }}
        KEY: ${{ inputs.benchmark-key || inputs.subject-name }}
        WAIVERS: ${{ inputs.benchmark-waivers }}
        WORK: ${{ steps.paths.outputs.work }}
        PREDICATE: ${{ steps.paths.outputs.benchmark }}
        ON_FAILURE: ${{ inputs.on-benchmark-failure }}
        # The image-benchmark action's script, from this checkout of the
        # repository: the same checks and Dockle the merge queue ran.
        CHECK: ${{ github.action_path }}/../image-benchmark/benchmark.sh
      run: |
        set -euo pipefail
        # The malware scan below reuses the pull.
        bash "$CHECK" "$IMAGE" "$PLATFORM" "$KEY" "$WAIVERS" "$PREDICATE" "$WORK" "$ON_FAILURE"

    - name: Scan for malware
      id: malware
      if: ${{ inputs.malware-scan == 'true' }}
      shell: bash
      env:
        IMAGE: ${{ inputs.image }}
        PLATFORM: ${{ inputs.platform }}
        PREDICATE: ${{ steps.paths.outputs.malware }}
        WORK: ${{ steps.paths.outputs.work }}
        ON_MALWARE: ${{ inputs.on-malware }}
        SCAN: ${{ github.action_path }}/malware-scan.sh
      run: |
        set -euo pipefail
        # Exit 3: no signature database, so there is nothing to attest.
        status=0
        bash "$SCAN" "$IMAGE" "$PLATFORM" "$PREDICATE" "$WORK" "$ON_MALWARE" || status=$?
        case "$status" in
          0) echo "attest=true" >> "$GITHUB_OUTPUT" ;;
          3) echo "attest=false" >> "$GITHUB_OUTPUT" ;;
          *) exit "$status" ;;
        esac

    - name: Wrap the vulnerability report
      if: ${{ inputs.vulnerability-report != '' }}
      shell: bash
      env:
        REPORT: ${{ inputs.vulnerability-report }}
        PREDICATE: ${{ steps.paths.outputs.vulnerabilities }}
        SCANNER_URI: ${{ inputs.vulnerability-scanner-uri }}
        SCANNER_VERSION: ${{ inputs.vulnerability-scanner-version }}
        PREDICATES: ${{ github.action_path }}/predicates.py
      run: |
        set -euo pipefail
        # The report's own times are not standard; the file's age bounds the scan.
        finished=$(date -u -r "$REPORT" +%Y-%m-%dT%H:%M:%SZ)
        python3 -I "$PREDICATES" vulnerabilities "$REPORT" "$PREDICATE" \
          --scanner-uri "$SCANNER_URI" --scanner-version "$SCANNER_VERSION" --started "$finished" --finished "$finished"

    - name: Install cosign
      if: ${{ inputs.base-images-from != '' }}
      shell: bash
      env:
        INSTALL: ${{ github.action_path }}/../../supply-chain-policy/install-cosign.sh
      run: bash "$INSTALL"

    - name: Carry over the bases' VEX statements
      id: base-vex
      if: ${{ inputs.base-images-from != '' }}
      shell: bash
      env:
        IMAGE: ${{ inputs.image }}
        SUBJECT_NAME: ${{ inputs.subject-name }}
        PLATFORM: ${{ inputs.platform }}
        DOCKERFILES: ${{ inputs.base-images-from }}
        BIN: ${{ steps.paths.outputs.bin }}
        WORK: ${{ steps.paths.outputs.work }}
        BASE_VEX: ${{ github.action_path }}/base_vex.py
      run: |
        set -euo pipefail
        export PATH="$BIN:$PATH"
        arguments=()
        while IFS= read -r dockerfile; do
          [ -n "$dockerfile" ] && arguments+=(--dockerfile "$dockerfile")
        done <<<"$DOCKERFILES"
        python3 -I "$BASE_VEX" inherit --image "$IMAGE" --subject-name "$SUBJECT_NAME" --platform "$PLATFORM" \
          "${arguments[@]}" --output "$WORK/inherited-vex.json"
        echo "inherited=$WORK/inherited-vex.json" >> "$GITHUB_OUTPUT"

    - name: Select the VEX statements
      id: vex
      if: ${{ inputs.vex-document != '' || inputs.base-images-from != '' }}
      shell: bash
      env:
        DOCUMENT: ${{ inputs.vex-document }}
        INHERITED: ${{ steps.base-vex.outputs.inherited }}
        IMAGE: ${{ inputs.image }}
        SUBJECT_NAME: ${{ inputs.subject-name }}
        PREDICATE: ${{ steps.paths.outputs.vex }}
        PREDICATES: ${{ github.action_path }}/predicates.py
      run: |
        set -euo pipefail
        # Exit 3: no statement names this image, so there is nothing to attest.
        status=0
        python3 -I "$PREDICATES" vex "$DOCUMENT" "$PREDICATE" --image "$IMAGE" --subject-name "$SUBJECT_NAME" \
          --inherited "$INHERITED" || status=$?
        case "$status" in
          0) echo "attest=true" >> "$GITHUB_OUTPUT" ;;
          3) echo "attest=false" >> "$GITHUB_OUTPUT" ;;
          *) exit "$status" ;;
        esac

    - name: Attest the SPDX SBOM
      if: ${{ inputs.attest == 'true' }}
      uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
      with:
        subject-checksums: ${{ steps.paths.outputs.subjects }}
        predicate-type: https://spdx.dev/Document/v2.3
        predicate-path: ${{ steps.paths.outputs.sbom }}

    - name: Attest the CycloneDX SBOM
      if: ${{ inputs.attest == 'true' }}
      uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
      with:
        subject-checksums: ${{ steps.paths.outputs.subjects }}
        predicate-type: https://cyclonedx.org/bom
        predicate-path: ${{ steps.paths.outputs.cyclonedx }}

    - name: Attest the secret scan
      if: ${{ inputs.attest == 'true' }}
      uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
      with:
        subject-checksums: ${{ steps.paths.outputs.subjects }}
        predicate-type: https://archestra.ai/attestations/secret-scan/v1
        predicate-path: ${{ steps.paths.outputs.secrets }}

    - name: Attest the image benchmark
      if: ${{ inputs.attest == 'true' && inputs.image-benchmark == 'true' }}
      uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
      with:
        subject-checksums: ${{ steps.paths.outputs.subjects }}
        predicate-type: https://archestra.ai/attestations/image-benchmark/v1
        predicate-path: ${{ steps.paths.outputs.benchmark }}

    - name: Attest the malware scan
      if: ${{ inputs.attest == 'true' && steps.malware.outputs.attest == 'true' }}
      uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
      with:
        subject-checksums: ${{ steps.paths.outputs.subjects }}
        predicate-type: https://archestra.ai/attestations/malware-scan/v1
        predicate-path: ${{ steps.paths.outputs.malware }}

    - name: Attest the vulnerability scan
      if: ${{ inputs.attest == 'true' && inputs.vulnerability-report != '' }}
      uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
      with:
        subject-checksums: ${{ steps.paths.outputs.subjects }}
        predicate-type: https://cosign.sigstore.dev/attestation/vuln/v1
        predicate-path: ${{ steps.paths.outputs.vulnerabilities }}

    - name: Attest the VEX statements
      if: ${{ inputs.attest == 'true' && steps.vex.outputs.attest == 'true' }}
      uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
      with:
        subject-checksums: ${{ steps.paths.outputs.subjects }}
        predicate-type: https://openvex.dev/ns/v0.2.0
        predicate-path: ${{ steps.paths.outputs.vex }}
