name: Google Cloud authentication
description: Authenticate with Workload Identity Federation, optionally installing gcloud and configuring a registry.
inputs:
  service_account:
    description: Service account to impersonate. The caller retains its existing IAM trust.
    required: true
  workload_identity_provider:
    description: Full Workload Identity provider resource name.
    required: true
  token_format:
    description: Set to access_token when a later step needs an OAuth access token.
    default: ""
  setup_gcloud:
    description: Install gcloud. Automatically enabled when registry is set.
    default: "false"
  registry:
    description: Optional Docker registry hostname, for example europe-west1-docker.pkg.dev.
    default: ""
outputs:
  project_id:
    description: Google Cloud project identified by the authentication action.
    value: ${{ steps.auth.outputs.project_id }}
  credentials_file_path:
    description: Temporary credentials file, removed by the upstream post action.
    value: ${{ steps.auth.outputs.credentials_file_path }}
  access_token:
    description: Short-lived OAuth access token, when requested with token_format.
    value: ${{ steps.auth.outputs.access_token }}
runs:
  using: composite
  steps:
    - name: Authenticate to Google Cloud
      id: auth
      uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
      with:
        service_account: ${{ inputs.service_account }}
        workload_identity_provider: ${{ inputs.workload_identity_provider }}
        token_format: ${{ inputs.token_format }}
        create_credentials_file: true
        export_environment_variables: true
        cleanup_credentials: true
    - name: Set up Google Cloud
      if: inputs.setup_gcloud == 'true' || inputs.registry != ''
      uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
    - name: Configure Docker credential helper
      if: inputs.registry != ''
      shell: bash
      env:
        REGISTRY: ${{ inputs.registry }}
      run: |
        if [[ ! "$REGISTRY" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]+(:[0-9]+)?$ ]]; then
          echo "::error::registry must be a single hostname with an optional port"
          exit 1
        fi
        gcloud auth configure-docker "$REGISTRY" --quiet
