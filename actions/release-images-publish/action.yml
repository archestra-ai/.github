name: Publish through release-publisher
description: Ask archestra-ai/release-publisher to publish attested staged images and charts to their public names, and wait for its run.
inputs:
  token:
    description: Token of the project's release App for the publisher repository, with Contents write (dispatch) and Actions read (watch). Without `app-id` and `private-key`, the wait ends when this token expires.
    required: true
  project:
    description: Project name, as projects/<project>.json in the publisher repository.
    required: true
  version:
    description: Release version without a v prefix, or 0.0.0-smoke.<n> with smoke.
    required: true
  images-file:
    description: 'JSON file {"<public name>": "sha256:<digest>"} of the staged, attested digests.'
    required: true
  latest:
    description: Space-separated :latest channels to move (stable, newest). Empty moves none.
    default: ""
  charts:
    description: Newline-separated chart archives (<chart>-<version>.tgz) the publisher downloads from this run's artifacts.
    default: ""
  assets:
    description: Newline-separated release asset files (a Terraform provider's goreleaser output) the publisher downloads from this run's artifacts, verifies and signs.
    default: ""
  smoke:
    description: true sends a dry run that writes scratch names only.
    default: "false"
  gate:
    description: true asks for the release approval on a dry run, which otherwise needs none, to exercise it. Every other release, prereleases included, always needs it.
    default: "false"
  app-id:
    description: ID of the release App that `token` belongs to. With `private-key`, the wait mints a new token for the publisher repository before the current one expires (installation tokens last an hour; an approval can take longer).
    default: ""
  private-key:
    description: Private key of that App.
    default: ""
  publisher-repository:
    description: The publisher repository (archestra-ai/release-images until its rename).
    default: archestra-ai/release-publisher
outputs:
  run-url:
    description: The publisher run.
    value: ${{ steps.publish.outputs.run-url }}
  run-id:
    description: The publisher run's ID, to download what it returns (a Terraform provider's signed release-assets artifact).
    value: ${{ steps.publish.outputs.run-id }}
runs:
  using: composite
  steps:
    - name: Publish through release-publisher
      id: publish
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        PUBLISH_PROJECT: ${{ inputs.project }}
        PUBLISH_VERSION: ${{ inputs.version }}
        PUBLISH_IMAGES_FILE: ${{ inputs.images-file }}
        PUBLISH_LATEST: ${{ inputs.latest }}
        PUBLISH_CHARTS: ${{ inputs.charts }}
        PUBLISH_ASSETS: ${{ inputs.assets }}
        PUBLISH_SMOKE: ${{ inputs.smoke }}
        PUBLISH_GATE: ${{ inputs.gate }}
        PUBLISHER_REPOSITORY: ${{ inputs.publisher-repository }}
        PUBLISH_APP_ID: ${{ inputs.app-id }}
        PUBLISH_APP_PRIVATE_KEY: ${{ inputs.private-key }}
        PUBLISH_SCRIPT: ${{ github.action_path }}/publish.py
      run: python3 -I "$PUBLISH_SCRIPT"
