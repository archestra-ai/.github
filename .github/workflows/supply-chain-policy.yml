name: Supply-Chain Policy

on:
  pull_request:
  merge_group:

concurrency:
  group: supply-chain-policy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  supply-chain-policy:
    name: Supply-Chain Policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # read the repository under check, including private ones
    steps:
      - name: Checkout target repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: target
          persist-credentials: false

      # The checker comes from the same commit as this workflow file, so the
      # ruleset's ref decides both. If GitHub ever reports a workflow ref
      # outside this repository, fall back to main.
      - name: Checkout org workflow repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: archestra-ai/.github
          ref: ${{ startsWith(github.workflow_ref, 'archestra-ai/.github/') && github.workflow_sha || 'main' }}
          path: .org-github
          persist-credentials: false

      - name: Check supply-chain policy
        run: python3 .org-github/supply-chain-policy/check_supply_chain_policy.py target

      # Cargo has no stable release-age setting. Compare every tracked
      # Cargo.lock with the base commit and look up each newly locked
      # crates.io version. The read-only job token fetches the base commit of
      # a private repository; Git reads it from the environment and never
      # writes it to disk.
      - name: Check new Cargo dependency release ages
        if: ${{ !cancelled() }}
        working-directory: target
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          GH_TOKEN: ${{ github.token }}
          GIT_CONFIG_COUNT: "2"
          GIT_CONFIG_KEY_0: credential.helper
          GIT_CONFIG_VALUE_0: ""
          GIT_CONFIG_KEY_1: credential.https://github.com.helper
          GIT_CONFIG_VALUE_1: '!f() { echo username=x-access-token; echo "password=$GH_TOKEN"; }; f'
        run: |
          if [ -z "$(git ls-files -- '*Cargo.lock')" ]; then
            echo "No Cargo.lock; skipped."
            exit 0
          fi
          if [[ ! "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::No base commit to compare Cargo.lock files with."
            exit 1
          fi
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          python3 ../.org-github/actions/cargo-release-age/check-cargo-release-age.py \
            --base-ref "$BASE_SHA" --all-lockfiles
