name: Shared Action Tests

on:
  pull_request:
  push:
    branches: [main]
  merge_group:

concurrency:
  group: shared-actions-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  test:
    name: Shared Action Tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Use the review action's Node runtime
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
      # Every test_*.py in the repository, one unittest process per directory.
      # RUN_NETWORK_TESTS turns on staging-iap's network test, which only runs
      # on a Linux runner and drives the review action with the Node above.
      - name: Python tests
        env:
          RUN_NETWORK_TESTS: "1"
        run: python3 tests/run_python_tests.py
      - name: Test PR title rules
        run: node --test actions/lint-pr-title/commitlint.config.test.mjs

  # Builds the SBOM and runs the secret scan for a real image, without signing:
  # a pull request here must not attest an image it did not build.
  attest-release-image:
    name: Attest release image (dry run)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Scan a public image
        id: scan
        uses: $/actions/attest-release-image
        with:
          image: gcr.io/distroless/static@sha256:aafe993665bf6200db38a02c11a9351e782a84b6a45e7f33b6695638c88e3931
          subject-name: gcr.io/distroless/static
          vex-document: actions/attest-release-image/testdata/openvex.json
          attest: "false"
      - name: Validate the VEX fixture
        uses: $/actions/validate-vex
        with:
          document: actions/attest-release-image/testdata/openvex.json
      - name: Check the outputs
        env:
          SBOM: ${{ steps.scan.outputs.sbom-path }}
          CYCLONEDX: ${{ steps.scan.outputs.cyclonedx-path }}
          SECRETS: ${{ steps.scan.outputs.secret-scan-path }}
          VEX: ${{ steps.scan.outputs.vex-path }}
          MALWARE: ${{ steps.scan.outputs.malware-scan-path }}
        run: |
          set -euo pipefail
          jq -e '.spdxVersion == "SPDX-2.3" and (.packages | length) > 0' "$SBOM"
          # Packages only: no package-to-file relationships (they outgrow the 16 MiB limit).
          jq -e '[.relationships[]? | select(.relationshipType == "CONTAINS" and (.spdxElementId | startswith("SPDXRef-Package")) and (.relatedSpdxElement | startswith("SPDXRef-File")))] | length == 0' "$SBOM"
          jq -e '.bomFormat == "CycloneDX" and (.components | length) > 0' "$CYCLONEDX"
          jq -e '.result.verified == 0 and .scanner.version != ""' "$SECRETS"
          # A fresh signature database and every file of the image scanned, clean.
          jq -e '.result.infected == 0 and .result.scannedFiles > 100 and (.scanner.database.version | test("^[0-9]+$"))' "$MALWARE"
          # The fixture's statement, pinned to the scanned digest under the subject name.
          jq -e '.statements | length == 1 and (.[0].products[0]["@id"]
            == "pkg:oci/static@sha256%3Aaafe993665bf6200db38a02c11a9351e782a84b6a45e7f33b6695638c88e3931?repository_url=gcr.io/distroless/static")' "$VEX"

  # The Image Benchmark workflow's plan, build and check against a fixture
  # repository on a real runner: an image that passes, one that fails, and an
  # undeclared Dockerfile.
  # Builds the pinned skopeo and copies an image index with zstd layers (the
  # form every Docker Hardened Images build takes) with its digest preserved,
  # which the runner's packaged skopeo refuses.
  setup-skopeo:
    name: Set up skopeo
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Set up skopeo
        uses: $/actions/setup-skopeo
      - name: Copy a zstd image index with its digest preserved
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          mkdir fixture
          printf 'FROM scratch\nCOPY file /file\n' > fixture/Dockerfile
          echo fixture > fixture/file
          docker buildx create --use --driver docker-container >/dev/null
          docker buildx build --platform linux/amd64 --provenance mode=min \
            --output type=oci,dest=image.oci.tar,compression=zstd,force-compression=true,oci-artifact=false fixture
          skopeo copy --all --preserve-digests oci-archive:image.oci.tar oci:copied
          root=$(tar -xOf image.oci.tar index.json | jq -r '.manifests[0].digest')
          [ "$(jq -r '.manifests[0].digest' copied/index.json)" = "$root" ]

  image-benchmark:
    name: Image benchmark (fixture repository)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Plan, build and check the fixture
        env:
          TOOLS: ${{ github.workspace }}/actions/image-benchmark
        run: bash actions/image-benchmark/testdata/fixture-repository.sh

  # Verifies a published release image's build provenance against the
  # Build Level 3 policy and writes the summary, without signing it.
  attest-verification-summary:
    name: Attest verification summary (dry run)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Verify archestra/platform 1.4.37
        id: summary
        uses: $/actions/attest-verification-summary
        with:
          image: docker.io/archestra/platform@sha256:46de5d667fa9b89ecc693516efdf1003452a95e9696159fb9262a8754f727f9c
          subject-name: docker.io/archestra/platform
          repository: archestra-ai/archestra
          attest: "false"
      - name: Check the summary
        env:
          SUMMARY: ${{ steps.summary.outputs.summary-path }}
        run: |
          set -euo pipefail
          jq -e '.verificationResult == "PASSED" and .verifiedLevels == ["SLSA_BUILD_LEVEL_3"] and (.inputAttestations | length) > 0' "$SUMMARY"

  base-image-signatures:
    # The supply-chain policy's base-image check against real registries and
    # the GitHub attestations API, with the job token, as in the policy job.
    name: Base Image Signatures
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install cosign and notation
        run: |
          bash supply-chain-policy/install-cosign.sh
          bash supply-chain-policy/install-notation.sh
      - name: Signed images verify
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          fixture="$RUNNER_TEMP/signed"
          mkdir -p "$fixture"
          cat > "$fixture/Dockerfile" <<'DOCKERFILE'
          FROM docker.io/archestra/platform:1.5.0-rc.28@sha256:fab17463fe186b263180ca65166356b1a12eb610afb6541d9d6a373dda205d43 AS platform
          COPY --from=ghcr.io/astral-sh/uv:0.11.15@sha256:e590846f4776907b254ac0f44b5b380347af5d90d668138ca7938d1b0c2f98d3 /uv /bin/uv
          FROM gcr.io/distroless/static-debian12:nonroot@sha256:afa5c872c891853ca7fcf1f12c3edb23f7eeef36189728842dd51042ff57f7ab
          FROM mcr.microsoft.com/dotnet/sdk:8.0-alpine@sha256:8a80a27ddac789b4cb6d09d244f9c8d840da599c5ad22f7233c04be470e55261
          FROM node:24-slim
          DOCKERFILE
          python3 supply-chain-policy/verify_base_images.py "$fixture"
      - name: An image without its publisher's signature fails
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          fixture="$RUNNER_TEMP/unsigned"
          mkdir -p "$fixture"
          # uv 0.5.18 predates uv's image attestations.
          echo 'FROM ghcr.io/astral-sh/uv:0.5.18@sha256:e2101b9e627153b8fe4e8a1249cc4194f1b38ece7f28a5a9b8f958e3b560e69c' > "$fixture/Dockerfile"
          if python3 supply-chain-policy/verify_base_images.py "$fixture"; then
            echo "::error::An unsigned image passed verification."
            exit 1
          fi
