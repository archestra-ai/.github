name: Shared Action Tests

on:
  pull_request:
  push:
    branches: [main]
  merge_group:

concurrency:
  group: shared-actions-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  test:
    name: Shared Action Tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test runtime review error propagation
        run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Test release age policy
        run: python3 -m unittest discover -s actions/cargo-release-age -p 'test_*.py'
      - name: Test supply-chain policy checker
        run: python3 -m unittest discover -s supply-chain-policy -p 'test_*.py'
      - name: Test Vercel deployment arguments and failures
        run: python3 -m unittest discover -s actions/vercel-deploy -p 'test_*.py'
      - name: Test release-images requests
        run: python3 -m unittest discover -s actions/release-images-publish -p 'test_*.py'
      - name: Test release publication checks
        run: python3 -m unittest discover -s actions/release-publish-verify -p 'test_*.py'
      - name: Test the previous-release check
        run: python3 -m unittest discover -s actions/previous-release-published -p 'test_*.py'
      - name: Use the review action's Node runtime
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Test PR title rules
        run: node --test actions/lint-pr-title/commitlint.config.test.mjs
      - name: Test private review access boundaries and cleanup
        env:
          RUN_NETWORK_TESTS: "1"
        run: python3 -m unittest discover -s actions/staging-iap -p 'test_*.py'

  base-image-signatures:
    # The supply-chain policy's base-image check against real registries and
    # the GitHub attestations API, with the job token, as in the policy job.
    name: Base Image Signatures
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install cosign
        run: bash supply-chain-policy/install-cosign.sh
      - name: Signed images verify
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          fixture="$RUNNER_TEMP/signed"
          mkdir -p "$fixture"
          cat > "$fixture/Dockerfile" <<'DOCKERFILE'
          FROM docker.io/archestra/platform:1.5.0-rc.28@sha256:fab17463fe186b263180ca65166356b1a12eb610afb6541d9d6a373dda205d43 AS platform
          COPY --from=ghcr.io/astral-sh/uv:0.11.15@sha256:e590846f4776907b254ac0f44b5b380347af5d90d668138ca7938d1b0c2f98d3 /uv /bin/uv
          FROM gcr.io/distroless/static-debian12:nonroot@sha256:afa5c872c891853ca7fcf1f12c3edb23f7eeef36189728842dd51042ff57f7ab
          FROM node:24-slim
          DOCKERFILE
          python3 supply-chain-policy/verify_base_images.py "$fixture"
      - name: An image without its publisher's signature fails
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          fixture="$RUNNER_TEMP/unsigned"
          mkdir -p "$fixture"
          # uv 0.5.18 predates uv's image attestations.
          echo 'FROM ghcr.io/astral-sh/uv:0.5.18@sha256:e2101b9e627153b8fe4e8a1249cc4194f1b38ece7f28a5a9b8f958e3b560e69c' > "$fixture/Dockerfile"
          if python3 supply-chain-policy/verify_base_images.py "$fixture"; then
            echo "::error::An unsigned image passed verification."
            exit 1
          fi
