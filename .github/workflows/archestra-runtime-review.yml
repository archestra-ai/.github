# Reviews every maintainer's pull request in the organization on an Archestra
# Agent Runtime, and posts the review as the Archestra Lobster App.
#
# An organization ruleset ("Require workflows to pass before merging") runs
# this file, from this repository's main branch, on every pull request of
# every repository. No repository holds a workflow of its own, and whatever is
# merged here is live everywhere at once. The private staging trust (infra,
# gcp/workload_identity) and the review gateway accept this workflow by that
# branch, so no pin moves when it changes. Until a ruleset names it, this file
# only runs on pull requests of this repository.
#
# - Maintainers only: a review runs only on a pull request that a maintainer
#   (admin or maintain role on the repository) opened, and only when the
#   author started the run by opening, pushing or reopening it. Whoever
#   re-runs a job must be a maintainer too. Anything else, such as a
#   contributor's pull request or a push by someone else, runs nothing and
#   says nothing.
# - No secrets: the job signs in to Archestra with its GitHub Actions
#   identity. Archestra runs the review as the author, who must have
#   connected GitHub through the Archestra Lobster App, and returns that
#   App's token, so the review posts as the App.
# - Change requests: a blocking finding (medium or above) requests changes;
#   a later review that finds nothing blocking dismisses it and says so.
#   Fixed findings' threads are resolved.
# - Ineligible pull requests skip the review. For eligible pull requests,
#   infrastructure failures fail the check; completed reviews use the App's
#   change requests for findings. A merge group gets a passing job.
# - A ruleset delivers only opened, synchronize and reopened: no comment
#   commands, team review requests or ready-for-review events reach it.
#
# The ARCHESTRA_REVIEW_GATEWAY_URL variable (or ARCHESTRA_CODE_REVIEW_GATEWAY_URL
# secret) configures the staging gateway below.
name: Archestra Runtime Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
  merge_group:

permissions: {}

# The review job replaces an older review of the pull request, so a run that
# the gate stops cannot cancel one. This group only keeps two runs of the same
# commit apart.
concurrency:
  group: archestra-runtime-review-${{ github.repository }}-${{ github.event.pull_request.number || github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  queue:
    name: Archestra Review (merge queue)
    if: github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Nothing to review in a merge group
        run: echo "The review runs on pull request events; a merge group has nothing to review."

  # Decides whether anything runs, and says nothing when it does not.
  gate:
    name: Check who started it
    if: >-
      github.event_name == 'pull_request' &&
      github.repository_owner == 'archestra-ai' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      !github.event.pull_request.draft &&
      !contains(github.event.pull_request.title, '[WIP]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read # Read collaborator roles.
      pull-requests: read # Read the pull request of the event.
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - name: Check the author and who started the run
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          ACTION: ${{ github.event.action }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
        shell: bash
        run: |
          maintainer() {
            local role
            role=$(gh api "repos/$REPOSITORY/collaborators/$1/permission" --jq .role_name 2>/dev/null || true)
            [[ "$role" == "admin" || "$role" == "maintain" ]]
          }
          [[ -n "$AUTHOR" ]] || exit 0
          case "$ACTION" in
            opened | synchronize | reopened | ready_for_review) ;;
            *) exit 0 ;;
          esac
          [[ "$ACTOR" == "$AUTHOR" ]] || exit 0
          maintainer "$AUTHOR" || exit 0
          # A re-run acts as whoever started the first run.
          if [[ -n "$TRIGGERING_ACTOR" && "$TRIGGERING_ACTOR" != "$ACTOR" ]]; then
            maintainer "$TRIGGERING_ACTOR" || exit 0
          fi
          echo "run=true" >> "$GITHUB_OUTPUT"

  review:
    name: Archestra Review
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # A newer review of the pull request replaces this one. Only a run the
    # gate let through can replace it.
    concurrency:
      group: archestra-runtime-review-${{ github.repository }}-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      contents: read # Read the repository.
      pull-requests: write # Post the review comment and inline comments.
      checks: read # Give the reviewer the checks of the reviewed commit.
      actions: read # Read failing jobs, logs and annotations for the reviewer.
      id-token: write # Short-lived identity for the private staging tunnel and the Archestra sign-in.
    steps:
      # The staging trust and the review gateway accept exactly one identity:
      # this file on this repository's main branch. The log shows the identity
      # the job presents, so a refusal is read off the run. The token itself
      # is never printed.
      - name: Show the job's identity
        shell: bash
        run: |
          curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=archestra-review-identity" |
            python3 -c '
          import base64, json, sys
          payload = json.load(sys.stdin)["value"].split(".")[1]
          claims = json.loads(base64.urlsafe_b64decode(payload + "=" * (-len(payload) % 4)))
          for name in ("job_workflow_ref", "workflow_ref", "repository", "event_name", "actor"):
              print(f"{name}={claims.get(name)}")
          ' || echo "::warning::Could not read the job's identity."

      # Let the result guard report a failed tunnel as an incomplete review;
      # the review action itself must not run without staging access.
      - name: Connect to private staging
        id: iap
        continue-on-error: true
        uses: archestra-ai/.github/actions/staging-iap@c3001f82a468e05482bd7c8cd08ff97f94e80d2e # v1.14.0
        env:
          CODE_REVIEW_MCP_URL: ${{ vars.ARCHESTRA_REVIEW_GATEWAY_URL || secrets.ARCHESTRA_CODE_REVIEW_GATEWAY_URL }}
        with:
          gateway-url: ${{ env.CODE_REVIEW_MCP_URL }}

      # A canceled job (a newer push) stops its runtime run in this step,
      # while the tunnel is still up, and records itself in the review comment.
      - name: Review on the Archestra runtime
        id: review
        if: steps.iap.outcome == 'success'
        continue-on-error: true
        uses: archestra-ai/code-review-action@84c76bbbfb84ee7035b7ac4df864f423506d0a1d # v0.11.0-rc.1
        env:
          CODE_REVIEW_MCP_URL: ${{ vars.ARCHESTRA_REVIEW_GATEWAY_URL || secrets.ARCHESTRA_CODE_REVIEW_GATEWAY_URL }}
        with:
          mode: auto
          archestra-gateway-url: ${{ env.CODE_REVIEW_MCP_URL }}
          # The gateway is dialed at the tunnel's local address, with its own hostname
          # for TLS; nothing on the runner is rerouted, so no other name can end up there.
          archestra-connect-to: ${{ steps.iap.outputs.connect-to }}
          archestra-auth: github-actions
          review-event: request-changes
          retries: 1
          # No memory floor: the action asks for the smallest tier with two CPUs.
          # A review the kernel killed for memory is retried on a larger tier,
          # up to twice, when the gateway reported the tier it ran on.
          timeout-minutes: 30
          # Below the job's limit, so the action stops its last attempt and
          # reports it while the tunnel is still up.
          overall-timeout-minutes: 80
          # Findings use change requests. The result guard below fails the job
          # if the action fails or returns an incomplete review status.
          fail-on: never
          fix-commands: false
          ci-rerun: false

      # Require an explicit completed result or intentional action-level skip.
      # A skipped step after tunnel failure has no status and must fail.
      - name: Require a review result
        if: ${{ !cancelled() }}
        env:
          REVIEW_OUTCOME: ${{ steps.review.outcome }}
          REVIEW_STATUS: ${{ steps.review.outputs.status }}
        shell: bash
        run: |
          case "$REVIEW_OUTCOME:$REVIEW_STATUS" in
            success:success | success:skipped | success:nothing-to-do) exit 0 ;;
            *) echo "::error::Review did not complete (outcome=$REVIEW_OUTCOME, status=$REVIEW_STATUS); the step above says why."; exit 1 ;;
          esac

      - name: Close private staging access
        if: always() && steps.iap.outcome != 'skipped'
        continue-on-error: true
        uses: archestra-ai/.github/actions/staging-iap@c3001f82a468e05482bd7c8cd08ff97f94e80d2e # v1.14.0
        with:
          operation: stop
