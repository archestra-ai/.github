name: Cargo Release Age Tests

on:
  pull_request:
  push:
    branches: [main]
  merge_group:

concurrency:
  group: cargo-release-age-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  test:
    name: Cargo Release Age Tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test release age policy
        run: python3 -m unittest discover -s actions/cargo-release-age -p 'test_*.py'
