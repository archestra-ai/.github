# Asks archestra-ai/release-publisher to publish a release run's attested
# staged images, charts and release assets, and waits for the publisher's run,
# the release's approval included (every release, prereleases too; not dry
# runs). Callers wait here, so the 360-minute
# limit (the longest a GitHub-hosted job may run) is set once.
#
# - Attest build provenance in the caller's own job, before this one. An
#   attestation names the workflow file that ran its step, and the publisher
#   accepts provenance only from the project's release workflow, never this
#   file.
# - What each image contains is attested here (the attest-contents job,
#   actions/attest-release-image): SPDX and CycloneDX SBOMs, a secret scan, a
#   ClamAV malware scan and a Dockle image benchmark (the CIS Docker
#   Benchmark's image checks, with the project's `benchmark-waivers`), signed
#   by this workflow, which the publisher accepts for those types only. A
#   secret verified as live, malware, or a benchmark failure no waiver covers
#   stops the release before the request is sent. actions/attest-verification-summary
#   signs a SLSA verification summary of each image's build provenance.
#   With `vex-document`, each image's statements in the project's OpenVEX
#   document (read from the release commit, or from `vex-ref`) are attested
#   there too, pinned to its digest. The caller's job then also grants `contents: read`.
#   With `base-images-from`, the statements Docker signed for the images'
#   Docker Hardened Images bases (dhi.io) are attested with them, for packages
#   whose exact build an image holds; pass `DHI_TOKEN` to pull from dhi.io.
#   The caller's job grants `id-token: write`, `attestations: write` and
#   `packages: read` (to pull the staged images); dry runs skip it.
# - The request names this run attempt (`<run>-<attempt>`). The publisher
#   accepts an attestation from this attempt or an earlier attempt of the same
#   run, so "Re-run failed jobs" re-runs this wait without the attest job.
# - Charts and release assets come from artifacts of the calling run; this job
#   downloads them only to hash them. The publisher downloads and checks them
#   itself.
# - What the publisher returns (a Terraform provider's signed release assets)
#   is copied into the calling run as an artifact of the same name, so later
#   caller jobs need no publisher token.
# - Steps after the publish (a GitHub release, notifications) stay in the
#   caller's jobs that need this one.
#
# `wait: false` hands the request off instead: this job ends once the
# publisher run exists (minutes, not hours) and keeps the request as the
# artifact `release-request-<attempt>` (35 days). The release then waits for
# its approval in the publisher, up to GitHub's 30-day limit for a job waiting
# on a review, and the caller finishes it in a separate workflow (started by
# Release Gate when the publisher run succeeds, and by a schedule) whose job
# runs the release-publish-verify action before it writes anything. A
# hand-off cannot return an artifact (`return-artifact`).
#
# When waiting, and nobody approves a release in time, this job fails after 360
# minutes while the publisher run keeps waiting. Retry in the calling run once
# an approver is around ("Re-run failed jobs"; archestra re-runs all jobs): the
# new request asks for a new approval, and the publisher is idempotent.
#
# The wait outlives the one-hour App installation token: the action mints a
# new one, for the publisher repository only, every 45 minutes.
#
# Keep the release App's key in an environment that only release refs can use,
# and name it in `environment`. A job that calls a reusable workflow cannot set
# `environment` itself, so the job here does.
#
# Usage:
#
#   jobs:
#     publish:
#       needs: attest
#       permissions:
#         actions: read # download this run's chart and asset artifacts
#         id-token: write # sign the image contents attestations
#         attestations: write # store them
#         packages: read # pull the staged images to scan them
#       uses: archestra-ai/.github/.github/workflows/release-publish.yml@<sha> # vX.Y.Z
#       with:
#         environment: releaser
#         project: openappa
#         version: ${{ needs.attest.outputs.version }}
#         images: ${{ needs.attest.outputs.images }}
#         latest: stable
#         chart-artifact: release-charts
#       secrets:
#         APP_ID: ${{ secrets.APP_ID }}
#         APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
name: Publish through release-publisher

on:
  workflow_call:
    inputs:
      environment:
        description: >-
          Deployment environment that holds APP_ID and APP_PRIVATE_KEY. Empty
          runs the job outside any environment.
        type: string
        default: ""
      project:
        description: Project name, as projects/<project>.json in the publisher repository.
        type: string
        required: true
      version:
        description: Release version without a v prefix, or 0.0.0-smoke.<n> with smoke.
        type: string
        required: true
      images:
        description: 'JSON object {"<public name>": "sha256:<digest>"} of the staged, attested digests.'
        type: string
        required: true
      latest:
        description: Space-separated :latest channels to move (stable, newest). Empty moves none.
        type: string
        default: ""
      chart-artifact:
        description: Artifact of the calling run holding the chart archives (<chart>-<version>.tgz). Empty sends no charts.
        type: string
        default: ""
      vex-document:
        description: >-
          Path, in the calling repository, of the project's OpenVEX document (for example
          vex/openvex.json). It is read at the release commit, checked with the validate-vex rules, and
          each image's statements are attested for its digest. Needs `contents: read` in the calling
          job. Empty attests no VEX.
        type: string
        default: ""
      benchmark-waivers:
        description: >-
          Path, in the calling repository, of the project's image benchmark waivers (for example
          .github/image-benchmark-waivers.json, the file the Image Benchmark required workflow reads), read
          from the same commit as vex-document. Each image's waivers match its key in `images`. Needs
          `contents: read` in the calling job. Empty waives nothing.
        type: string
        default: ""
      base-images-from:
        description: >-
          Dockerfiles in the calling repository (paths, one per line) the images are built from, read at the
          release commit. For each `FROM dhi.io/...@sha256:...` base they pin, Docker's signed OpenVEX statements
          that are facts about a package build are attested for every image that holds that exact package build
          (actions/attest-release-image `base-images-from`). Needs `contents: read` in the calling job and
          the DHI_TOKEN secret. Empty carries nothing over.
        type: string
        default: ""
      vex-ref:
        description: >-
          Branch, tag or commit of the calling repository to read vex-document and benchmark-waivers from, for example main,
          so a release built from a maintenance branch attests the statements merged since it was cut.
          Empty reads the release commit.
        type: string
        default: ""
      asset-artifact:
        description: Artifact of the calling run holding the release asset files (a Terraform provider's goreleaser output). Empty sends no assets.
        type: string
        default: ""
      return-artifact:
        description: Artifact of the publisher run to copy into the calling run under the same name (release-assets for a Terraform provider). Empty copies nothing.
        type: string
        default: ""
      smoke:
        description: Send a dry run that writes scratch names only.
        type: boolean
        default: false
      gate:
        description: Ask for the release approval on a dry run, which otherwise needs none, to exercise it. Every other release always needs it.
        type: boolean
        default: false
      publisher-repository:
        description: The publisher repository.
        type: string
        default: archestra-ai/release-publisher
      staging:
        description: Registry path the staged images are pulled from, as `<staging>/<image>@<digest>` (the publisher project's `staging`).
        type: string
        default: ghcr.io/archestra-ai/ci
      wait:
        description: >-
          Wait for the publisher run (approval included), up to 360 minutes.
          false hands the request off; finish the release in a workflow that
          runs release-publish-verify.
        type: boolean
        default: true
    secrets:
      APP_ID:
        description: ID of the project's release App, installed on the publisher repository.
        required: true
      APP_PRIVATE_KEY:
        description: Private key of that GitHub App.
        required: true
      DHI_TOKEN:
        description: >-
          Docker access token of the `archestra` Docker account (the DOCKERHUB_DHI_TOKEN organization secret),
          to pull dhi.io bases for base-images-from.
        required: false
    outputs:
      run-url:
        description: The publisher run.
        value: ${{ jobs.publish.outputs.run-url }}
      run-id:
        description: The publisher run's ID.
        value: ${{ jobs.publish.outputs.run-id }}

permissions: {}

jobs:
  # One matrix entry per image: {"label": its key in images, "name": public name,
  # "image": staged reference}.
  # A variant (docker.io/archestra/platform:slim) is attested under its
  # repository's name and staged as <image>-<variant>, as the publisher reads it.
  contents-plan:
    name: Plan image contents attestations
    if: ${{ !inputs.smoke }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    outputs:
      images: ${{ steps.plan.outputs.images }}
    steps:
      - name: List the images
        id: plan
        env:
          IMAGES: ${{ inputs.images }}
          STAGING: ${{ inputs.staging }}
        run: |
          set -euo pipefail
          [[ "$STAGING" =~ ^ghcr\.io/archestra-ai/[a-z0-9._/-]+$ ]] || { echo "::error::Unexpected staging: $STAGING"; exit 1; }
          images=$(jq -c --arg staging "$STAGING" '[to_entries[]
            | {label: .key, name: (.key | split(":") | first),
               image: ($staging + "/" + (.key | split("/") | last | sub(":"; "-")) + "@" + .value)}]' <<<"$IMAGES")
          jq -e 'length > 0 and all(.[]; .image | test("@sha256:[0-9a-f]{64}$"))' <<<"$images" > /dev/null \
            || { echo "::error::images must map public names to sha256 digests"; exit 1; }
          echo "images=$images" >> "$GITHUB_OUTPUT"

  attest-contents:
    name: Attest contents of ${{ matrix.image.label }}
    needs: contents-plan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read # read the VEX document, benchmark waivers and Dockerfiles at the release commit
      id-token: write # sign the attestations
      attestations: write # store them
      packages: read # pull the staged image
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.contents-plan.outputs.images) }}
    steps:
      - name: Log in to the staging registry
        env:
          GH_TOKEN: ${{ github.token }}
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      # Only the VEX document and the benchmark waivers, from the commit the
      # release was built from or from vex-ref.
      - name: Check out the VEX document and benchmark waivers
        if: ${{ inputs.vex-document != '' || inputs.benchmark-waivers != '' }}
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.vex-ref || github.sha }}
          path: release-publish/source
          sparse-checkout: |
            ${{ inputs.vex-document }}
            ${{ inputs.benchmark-waivers }}
          sparse-checkout-cone-mode: false
          persist-credentials: false

      # The Dockerfiles always from the release commit: they name the bases
      # this release was built from.
      - name: Check out the Dockerfiles
        if: ${{ inputs.base-images-from != '' }}
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          path: release-publish/build
          sparse-checkout: ${{ inputs.base-images-from }}
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Log in to Docker Hardened Images
        id: dockerfiles
        if: ${{ inputs.base-images-from != '' }}
        env:
          DHI_TOKEN: ${{ secrets.DHI_TOKEN }}
          DOCKERFILES: ${{ inputs.base-images-from }}
        run: |
          set -euo pipefail
          [ -n "$DHI_TOKEN" ] || { echo "::error::base-images-from needs the DHI_TOKEN secret to pull dhi.io bases"; exit 1; }
          printf '%s' "$DHI_TOKEN" | docker login dhi.io --username archestra --password-stdin >/dev/null
          # The action reads the Dockerfiles from the checkout above.
          {
            echo "paths<<EOF"
            sed 's|^[[:space:]]*||; /^$/d; s|^|release-publish/build/|' <<<"$DOCKERFILES"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Attest the image contents
        uses: archestra-ai/.github/actions/attest-release-image@v1.45.7
        with:
          image: ${{ matrix.image.image }}
          subject-name: ${{ matrix.image.name }}
          vex-document: ${{ inputs.vex-document != '' && format('release-publish/source/{0}', inputs.vex-document) || '' }}
          base-images-from: ${{ steps.dockerfiles.outputs.paths }}
          benchmark-key: ${{ matrix.image.label }}
          benchmark-waivers: ${{ inputs.benchmark-waivers != '' && format('release-publish/source/{0}', inputs.benchmark-waivers) || '' }}

      # Checks the image's merge-queue provenance against the SLSA Build L3
      # policy and signs the result, so a consumer verifies one attestation.
      - name: Attest the verification summary
        uses: archestra-ai/.github/actions/attest-verification-summary@v1.45.7
        with:
          image: ${{ matrix.image.image }}
          subject-name: ${{ matrix.image.name }}

  publish:
    name: Publish through release-publisher
    needs: attest-contents
    # Dry runs skip the contents attestations.
    if: ${{ !cancelled() && (needs.attest-contents.result == 'success' || (inputs.smoke && needs.attest-contents.result == 'skipped')) }}
    runs-on: ubuntu-latest
    # A release (not a dry run) waits in the publisher for an approver who
    # did not merge it; a waiting job waits with it, up to the longest a
    # GitHub-hosted job may run. A hand-off only sends the request.
    timeout-minutes: ${{ inputs.wait && 360 || 15 }}
    # The environment only holds the App key; nothing is deployed, so no
    # deployment record is created. An empty name runs outside any environment.
    environment:
      name: ${{ inputs.environment }}
      deployment: false
    permissions:
      actions: read # download this run's chart and asset artifacts
    outputs:
      run-url: ${{ steps.publish.outputs.run-url }}
      run-id: ${{ steps.publish.outputs.run-id }}
    steps:
      - name: Download the charts
        if: ${{ inputs.chart-artifact != '' }}
        uses: actions/download-artifact@v8.0.2
        with:
          name: ${{ inputs.chart-artifact }}
          path: release-publish/charts

      - name: Download the release assets
        if: ${{ inputs.asset-artifact != '' }}
        uses: actions/download-artifact@v8.0.2
        with:
          name: ${{ inputs.asset-artifact }}
          path: release-publish/assets

      - name: Collect the request
        id: request
        env:
          IMAGES: ${{ inputs.images }}
          PUBLISHER_REPOSITORY: ${{ inputs.publisher-repository }}
          WAIT: ${{ inputs.wait }}
          RETURN_ARTIFACT: ${{ inputs.return-artifact }}
        run: |
          set -euo pipefail
          [ "$WAIT" = true ] || [ -z "$RETURN_ARTIFACT" ] \
            || { echo "::error::A hand-off (wait: false) cannot return an artifact"; exit 1; }
          [[ "$PUBLISHER_REPOSITORY" =~ ^archestra-ai/[A-Za-z0-9._-]+$ ]] \
            || { echo "::error::Unexpected publisher repository: $PUBLISHER_REPOSITORY"; exit 1; }
          mkdir -p release-publish
          printf '%s' "$IMAGES" > release-publish/images.json
          {
            echo "publisher=${PUBLISHER_REPOSITORY#*/}"
            echo "charts<<EOF"
            if [ -d release-publish/charts ]; then find release-publish/charts -maxdepth 1 -type f -name '*.tgz' | sort; fi
            echo "EOF"
            echo "assets<<EOF"
            if [ -d release-publish/assets ]; then find release-publish/assets -maxdepth 1 -type f | sort; fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Generate a publisher token
        id: publisher-token
        uses: actions/create-github-app-token@v3.3.0
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: archestra-ai
          repositories: ${{ steps.request.outputs.publisher }}
          # Send the repository_dispatch, watch the run and download what it returns.
          permission-contents: write
          permission-actions: read
          skip-token-revoke: false

      - name: Publish through release-publisher
        id: publish
        uses: archestra-ai/.github/actions/release-images-publish@v1.25.2
        with:
          token: ${{ steps.publisher-token.outputs.token }}
          project: ${{ inputs.project }}
          version: ${{ inputs.version }}
          images-file: release-publish/images.json
          latest: ${{ inputs.latest }}
          charts: ${{ steps.request.outputs.charts }}
          assets: ${{ steps.request.outputs.assets }}
          smoke: ${{ inputs.smoke && 'true' || 'false' }}
          gate: ${{ inputs.gate && 'true' || 'false' }}
          publisher-repository: ${{ inputs.publisher-repository }}
          wait: ${{ inputs.wait && 'true' || 'false' }}
          request-file: release-publish/request.json
          # Mint a new token before each one expires: an approval can take
          # longer than the hour an installation token lasts.
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      # What the caller's finishing workflow checks the publication against.
      # Kept longer than a request can wait for its approval (30 days).
      - name: Keep the request
        uses: actions/upload-artifact@v7.0.2
        with:
          name: release-request-${{ github.run_attempt }}
          path: release-publish/request.json
          if-no-files-found: error
          retention-days: 35

      # The first token may have expired during the wait.
      - name: Generate a token for what the publisher returns
        id: return-token
        if: ${{ inputs.return-artifact != '' }}
        uses: actions/create-github-app-token@v3.3.0
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: archestra-ai
          repositories: ${{ steps.request.outputs.publisher }}
          permission-actions: read
          skip-token-revoke: false

      - name: Download what the publisher returns
        if: ${{ inputs.return-artifact != '' }}
        env:
          GH_TOKEN: ${{ steps.return-token.outputs.token }}
          RUN_ID: ${{ steps.publish.outputs.run-id }}
          PUBLISHER_REPOSITORY: ${{ inputs.publisher-repository }}
          RETURN_ARTIFACT: ${{ inputs.return-artifact }}
        run: gh run download "$RUN_ID" --repo "$PUBLISHER_REPOSITORY" --name "$RETURN_ARTIFACT" --dir release-publish/returned

      - name: Keep what the publisher returns
        if: ${{ inputs.return-artifact != '' }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ${{ inputs.return-artifact }}
          path: release-publish/returned
          if-no-files-found: error
          # A retry in a later attempt of this run replaces the earlier copy.
          overwrite: true
