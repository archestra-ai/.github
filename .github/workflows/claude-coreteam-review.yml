name: Claude Core Team Review

on:
  workflow_call:
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: false

permissions: {}

# Different from the caller's group to avoid cancelling the caller itself.
concurrency:
  group: claude-coreteam-review-shared-${{ github.repository }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pr-review:
    name: PR Review
    if: >-
      github.event_name == 'pull_request' &&
      github.repository_owner == 'archestra-ai' &&
      contains(fromJSON('["opened", "synchronize", "ready_for_review", "reopened"]'), github.event.action) &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      !github.event.pull_request.draft &&
      !contains(github.event.pull_request.title, '[WIP]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write # Publish PR review comments.
      id-token: write # Authenticate as the Claude GitHub App.
    steps:
      - name: Check credential availability
        id: token
        env:
          CLAUDE_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        shell: bash
        run: |
          if [[ -n "$CLAUDE_TOKEN" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No OAuth token is available for this PR author. Grant this repository access to the author's organization secret."
          fi

      - name: Checkout caller repository
        if: steps.token.outputs.available == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: PR Review with Claude
        if: steps.token.outputs.available == 'true'
        # Internal action pinned to its implementation commit; no release tag exists.
        uses: archestra-ai/.github/actions/run-claude@3287f712b7b14c74f9c2305f3c4c0afa4615c0ff # zizmor: ignore[stale-action-refs]
        with:
          prompt: "/review-pr REPO: ${{ github.repository }} PR_NUMBER: ${{ github.event.pull_request.number }}"
          allowed_tools: "Read,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          use_sticky_comment: "true"
          track_progress: "true"
          show_full_output: "true"
